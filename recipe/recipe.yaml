schema_version: 1

context:
  name: mp-api
  version: 0.47.2
  python_min: '3.12'

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 356e9e9d55c61a0f938f5c1a2c7e6ea0c061a53a480d2f5e00c276f364c48484

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - orjson >=3.10,<4
    - boto3 >=1.34
    - python >=${{ python_min }}
    - pymatgen >=2026.10.24
    - requests >=2.23.0
    - monty >=2024.12.10
    - emmet-core >=0.88.0
    - deltalake >=1.4.0,<1.6.0
    - pyarrow >=20.0.0
    - rich >=13.0
tests:
  - python:
      imports:
        - mp_api
      pip_check: true
      python_version:
        - ${{ python_min }}
        - '*'

about:
  summary: API Client for the Materials Project
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/materialsproject/api

extra:
  recipe-maintainers:
    - jan-janssen
